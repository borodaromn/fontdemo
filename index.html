<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Font Showcase — Консоль Шрифтів</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- opentype.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            console: {
              bg: '#050a05',
              panel: '#0a140a',
              border: '#1b3b1b',
              neon: '#00ff66',
              dim: '#008833'
            }
          },
          fontFamily: {
            mono: ['Courier New', 'Courier', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #050a05;
      color: #00ff66;
    }
    .console-glow {
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.6), 0 0 20px rgba(0, 255, 102, 0.3);
    }
    .console-box-glow {
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.15), inset 0 0 15px rgba(0, 255, 102, 0.05);
    }
    .tested-font {
      font-family: 'ActiveCustomFont', monospace;
      transition: all 0.3s ease;
      white-space: pre-wrap;
      word-break: break-word;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #050a05;
    }
    ::-webkit-scrollbar-thumb {
      background: #1b3b1b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00ff66;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 selection:bg-console-neon selection:text-black">

  <!-- HEADER / INFO BANNER -->
  <header class="w-full max-w-6xl mx-auto bg-console-panel border border-console-border rounded-xl p-4 mb-4 console-box-glow flex flex-col md:flex-row justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-console-border flex items-center justify-center text-console-neon text-xl font-bold animate-pulse">
        <i class="fa-solid fa-terminal"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-wider text-console-neon uppercase">FONT_ROTATOR // DEMO</h1>
        <p class="text-xs text-console-dim font-mono">Автоматичне тестування шрифтів з папки /fonts</p>
      </div>
    </div>

    <!-- LARGE FONT PATH DISPLAY -->
    <div class="bg-console-bg border border-console-border px-5 py-2.5 rounded-lg text-center flex flex-col items-center justify-center min-w-[280px]">
      <span class="text-[10px] uppercase text-console-dim tracking-widest font-mono">Поточний шрифт (каталог / файл):</span>
      <span id="currentFontLabel" class="text-lg font-extrabold text-console-neon font-mono console-glow tracking-wide mt-0.5">ЗАВАНТАЖЕННЯ...</span>
    </div>
  </header>

  <!-- MAIN CONTENT: POEMS DISPLAY -->
  <main class="w-full max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 mb-4">
    
    <!-- UKRAINIAN POEM PANEL -->
    <section class="bg-console-panel border border-console-border rounded-xl p-5 flex flex-col console-box-glow">
      <div class="flex justify-between items-center border-b border-console-border pb-2.5 mb-3">
        <span class="text-xs font-bold uppercase tracking-wider text-console-dim flex items-center gap-2">
          <i class="fa-solid fa-code text-console-neon"></i> УКРАЇНСЬКИЙ ВІРШ [30с]
        </span>
        <span id="uaPoemCounter" class="text-[10px] font-mono text-console-dim bg-console-bg border border-console-border px-2 py-0.5 rounded">01 / 02</span>
      </div>
      <div class="flex-1 bg-console-bg border border-console-border/60 rounded-lg p-4 flex items-center justify-center">
        <div id="uaPoemText" class="tested-font text-console-neon console-glow text-lg leading-relaxed text-center"></div>
      </div>
    </section>

    <!-- ENGLISH POEM PANEL -->
    <section class="bg-console-panel border border-console-border rounded-xl p-5 flex flex-col console-box-glow">
      <div class="flex justify-between items-center border-b border-console-border pb-2.5 mb-3">
        <span class="text-xs font-bold uppercase tracking-wider text-console-dim flex items-center gap-2">
          <i class="fa-solid fa-code text-console-neon"></i> ENGLISH POEM [30s]
        </span>
        <span id="enPoemCounter" class="text-[10px] font-mono text-console-dim bg-console-bg border border-console-border px-2 py-0.5 rounded">01 / 02</span>
      </div>
      <div class="flex-1 bg-console-bg border border-console-border/60 rounded-lg p-4 flex items-center justify-center">
        <div id="enPoemText" class="tested-font text-console-neon console-glow text-lg leading-relaxed text-center"></div>
      </div>
    </section>

  </main>

  <!-- FOOTER STATUS -->
  <footer class="w-full max-w-6xl mx-auto text-center text-xs text-console-dim font-mono">
    <span>СТАТУС: <span id="systemStatus" class="text-console-neon">Ініціалізація сканування шрифтів...</span></span>
  </footer>

  <script>
    // --- ДАНІ ВІРШІВ ---
    const uaPoems = [
      "Учітеся, брати мої,\nДумайте, читайте,\nІ чужому научайтесь,\nЙ свого не цурайтесь.\n\n[Т. Г. Шевченко]",
      "Реве та стогне Дніпр широкий,\nСердитий вітер завива,\nДодолу верби гне високі,\nГорами хвилю піддіва.\n\n[Т. Г. Шевченко]"
    ];

    const enPoems = [
      "O wad some Power the giftie gie us\nTo see oursels as ithers see us!\nIt wad frae mony a blunder free us,\nAn' foolish notion.\n\n[Robert Burns]",
      "Two roads diverged in a yellow wood,\nAnd sorry I could not travel both\nAnd be one traveler, long I stood\nAnd looked down one as far as I could.\n\n[Robert Frost]"
    ];

    let currentUaIndex = 0;
    let currentEnIndex = 0;
    let fontFilesList = [];
    let currentFontIndex = 0;
    let fontCounterID = 0;

    // Список ваших шрифтів з урахуванням підпапок із наданого лістингу
    const rawFontPaths = [
      "fonts/11 .svg",
      "fonts/11  (1).svg",
      "fonts/11  (1) (1).svg",
      "fonts/11  (1) (2).svg",
      "fonts/11  (2).svg",
      "fonts/10 .svg",
      "fonts/10  (1).svg",
      "fonts/10  (3).svg",
      "fonts/10A/ .svg",
      "fonts/10A/2222  .svg",
      "fonts/10E/v1/kostenko_valeria.svg",
      "fonts/10E/v1/ .svg",
      "fonts/10E/v1/_10_.svg",
      "fonts/10E/v1/  (1).svg",
      "fonts/10E/v2/ .svg",
      "fonts/10E/v2/  (1).svg",
      "fonts/10E/v2/  (2).svg",
      "fonts/10E/v2/kostenko_valeria (1).svg",
      "fonts/11 /33.svg",
      "fonts/11 /Savchenko_Rodion_new.svg",
      "fonts/11 /Savchenko_Rodion (2) (1).svg"
    ];

    // Функція парсингу SVG path для opentype.js (аналогічно робочому тестеру)
    function parseSvgPathToOpentype(d) {
      const path = new opentype.Path();
      if (!d) return path;
      const tokens = d.match(/([a-zA-Z])|([-+]?(?:\d+\.\d+|\d+|\.\d+)(?:[eE][-+]?\d+)?)/g);
      if (!tokens) return path;

      let i = 0, curX = 0, curY = 0, startX = 0, startY = 0, cmd = '';
      while (i < tokens.length) {
        if (/^[a-zA-Z]$/.test(tokens[i])) {
          cmd = tokens[i];
          i++;
        }
        switch (cmd) {
          case 'M':
            curX = parseFloat(tokens[i++]); curY = parseFloat(tokens[i++]);
            startX = curX; startY = curY;
            path.moveTo(curX, curY); cmd = 'L'; break;
          case 'm':
            curX += parseFloat(tokens[i++]); curY += parseFloat(tokens[i++]);
            startX = curX; startY = curY;
            path.moveTo(curX, curY); cmd = 'l'; break;
          case 'L':
            curX = parseFloat(tokens[i++]); curY = parseFloat(tokens[i++]);
            path.lineTo(curX, curY); break;
          case 'l':
            curX += parseFloat(tokens[i++]); curY += parseFloat(tokens[i++]);
            path.lineTo(curX, curY); break;
          case 'H':
            curX = parseFloat(tokens[i++]); path.lineTo(curX, curY); break;
          case 'h':
            curX += parseFloat(tokens[i++]); path.lineTo(curX, curY); break;
          case 'V':
            curY = parseFloat(tokens[i++]); path.lineTo(curX, curY); break;
          case 'v':
            curY += parseFloat(tokens[i++]); path.lineTo(curX, curY); break;
          case 'C':
            const x1 = parseFloat(tokens[i++]), y1 = parseFloat(tokens[i++]);
            const x2 = parseFloat(tokens[i++]), y2 = parseFloat(tokens[i++]);
            curX = parseFloat(tokens[i++]); curY = parseFloat(tokens[i++]);
            path.curveTo(x1, y1, x2, y2, curX, curY); break;
          case 'c':
            const dx1 = curX + parseFloat(tokens[i++]), dy1 = curY + parseFloat(tokens[i++]);
            const dx2 = curX + parseFloat(tokens[i++]), dy2 = curY + parseFloat(tokens[i++]);
            curX += parseFloat(tokens[i++]); curY += parseFloat(tokens[i++]);
            path.curveTo(dx1, dy1, dx2, dy2, curX, curY); break;
          case 'Q':
            const qx1 = parseFloat(tokens[i++]), qy1 = parseFloat(tokens[i++]);
            curX = parseFloat(tokens[i++]); curY = parseFloat(tokens[i++]);
            path.quadTo(qx1, qy1, curX, curY); break;
          case 'q':
            const dqx1 = curX + parseFloat(tokens[i++]), dqy1 = curY + parseFloat(tokens[i++]);
            curX += parseFloat(tokens[i++]); curY += parseFloat(tokens[i++]);
            path.quadTo(dqx1, dqy1, curX, curY); break;
          case 'Z':
          case 'z':
            path.closePath(); curX = startX; curY = startY; break;
          default:
            i++; break;
        }
      }
      return path;
    }

    // Завантаження та конвертація SVG шрифту у TTF через opentype.js
    async function loadAndApplyFont(pathStr) {
      try {
        const response = await fetch(pathStr);
        if (!response.ok) throw new Error(`Файл не знайдено: ${pathStr}`);
        const svgText = await response.text();

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(svgText, 'image/svg+xml');
        const fontElem = xmlDoc.querySelector('font');
        const fontFaceNode = xmlDoc.querySelector('font-face');

        const unitsPerEm = parseInt(fontFaceNode?.getAttribute('units-per-em')) || 800;
        const ascent = parseInt(fontFaceNode?.getAttribute('ascent')) || 800;
        const descent = parseInt(fontFaceNode?.getAttribute('descent')) || 0;
        const defaultAdv = parseInt(fontElem?.getAttribute('horiz-adv-x')) || 900;

        const glyphList = [];
        // .notdef гліф
        const notdefPath = new opentype.Path();
        notdefPath.moveTo(100, 100); notdefPath.lineTo(700, 100);
        notdefPath.lineTo(700, 700); notdefPath.lineTo(100, 700);
        notdefPath.closePath();
        glyphList.push(new opentype.Glyph({ name: '.notdef', unicode: 0, advanceWidth: defaultAdv, path: notdefPath }));

        let hasSpace = false;
        const glyphNodes = xmlDoc.querySelectorAll('glyph');
        glyphNodes.forEach((node, index) => {
          const unicodeAttr = node.getAttribute('unicode');
          const glyphName = node.getAttribute('glyph-name`') || `glyph_${index}`;
          const d = node.getAttribute('d') || '';
          const adv = parseInt(node.getAttribute('horiz-adv-x')) || defaultAdv;

          if (!unicodeAttr && glyphName !== 'space') return;
          const codePoint = unicodeAttr ? unicodeAttr.codePointAt(0) : (glyphName === 'space' ? 32 : null);
          if (codePoint === 32) hasSpace = true;

          if (codePoint !== null) {
            glyphList.push(new opentype.Glyph({
              name: glyphName,
              unicode: codePoint,
              advanceWidth: adv,
              path: parseSvgPathToOpentype(d)
            }));
          }
        });

        if (!hasSpace) {
          glyphList.push(new opentype.Glyph({ name: 'space', unicode: 32, advanceWidth: Math.round(defaultAdv * 0.5), path: new opentype.Path() }));
        }

        const font = new opentype.Font({
          familyName: 'DynamicFont',
          styleName: 'Regular',
          unitsPerEm: unitsPerEm,
          ascender: ascent,
          descender: descent,
          glyphs: glyphList
        });

        const blob = new Blob([font.toArrayBuffer()], { type: 'font/ttf' });
        const blobUrl = URL.createObjectURL(blob);

        fontCounterID++;
        const uniqueFamilyName = `FontUnit_${fontCounterID}`;
        const fontFace = new FontFace(uniqueFamilyName, `url(${blobUrl})`);
        
        await fontFace.load();
        document.fonts.add(fontFace);

        document.querySelectorAll('.tested-font').forEach(el => {
          el.style.fontFamily = `"${uniqueFamilyName}", monospace`;
        });

        // Форматування назви для виведення: великим шрифтом підпапка та файл
        // Наприклад: папка "fonts/10E/v2/" та файл "kostenko_valeria (1).svg"
        const lastSlash = pathStr.lastIndexOf('/');
        const folderPart = lastSlash !== -1 ? pathStr.substring(0, lastSlash) : 'fonts';
        const filePart = lastSlash !== -1 ? pathStr.substring(lastSlash + 1) : pathStr;

        document.getElementById('currentFontLabel').innerHTML = `
          <span class="text-console-dim text-xs block">${folderPart}/</span>
          <span class="text-console-neon">${filePart}</span>
        `;
        document.getElementById('systemStatus').textContent = `Шрифт завантажено успішно (${glyphNodes.length} гліфів)`;

      } catch (err) {
        console.error("Помилка завантаження шрифту:", pathStr, err);
        document.getElementById('systemStatus').textContent = `Помилка завантаження: ${pathStr}`;
      }
    }

    // Оновлення тексту віршів
    function updatePoems() {
      document.getElementById('uaPoemText').textContent = uaPoems[currentUaIndex];
      document.getElementById('uaPoemCounter').textContent = `0${currentUaIndex + 1} / 0${uaPoems.length}`;
      currentUaIndex = (currentUaIndex + 1) % uaPoems.length;

      document.getElementById('enPoemText').textContent = enPoems[currentEnIndex];
      document.getElementById('enPoemCounter').textContent = `0${currentEnIndex + 1} / 0${enPoems.length}`;
      currentEnIndex = (currentEnIndex + 1) % enPoems.length;
    }

    // Цикл перемикання шрифтів кожні 5 секунд
    function rotateFonts() {
      if (rawFontPaths.length === 0) return;
      loadAndApplyFont(rawFontPaths[currentFontIndex]);
      currentFontIndex = (currentFontIndex + 1) % rawFontPaths.length;
    }

    // Ініціалізація при завантаженні сторінки
    window.addEventListener('DOMContentLoaded', () => {
      updatePoems();
      rotateFonts();

      // Зміна шрифту кожні 5 секунд
      setInterval(rotateFonts, 5000);

      // Зміна віршів кожні 30 секунд
      setInterval(updatePoems, 30000);
    });
  </script>
</body>
</html>
