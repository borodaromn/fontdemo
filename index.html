      "fonts/11v/snisar_karina_1.svg"
    ];

    function parseSvgPathToOpentype(d) {
      const path = new opentype.Path();
      if (!d) return path;
      const tokens = d.match(/([a-zA-Z])|([-+]?(?:\d+\.\d+|\d+|\.\d+)(?:[eE][-+]?\d+)?)/g);
      if (!tokens) return path;

      let i = 0, curX = 0, curY = 0, startX = 0, startY = 0, cmd = '';
      while (i < tokens.length) {
        if (/^[a-zA-Z]$/.test(tokens[i])) {
          cmd = tokens[i];
          i++;
        }
        switch (cmd) {
          case 'M':
            curX = parseFloat(tokens[i++]); curY = parseFloat(tokens[i++]);
            startX = curX; startY = curY;
            path.moveTo(curX, curY); cmd = 'L'; break;
          case 'm':
            curX += parseFloat(tokens[i++]); curY += parseFloat(tokens[i++]);
            startX = curX; startY = curY;
            path.moveTo(curX, curY); cmd = 'l'; break;
          case 'L':
            curX = parseFloat(tokens[i++]); curY = parseFloat(tokens[i++]);
            path.lineTo(curX, curY); break;
          case 'l':
            curX += parseFloat(tokens[i++]); curY += parseFloat(tokens[i++]);
            path.lineTo(curX, curY); break;
          case 'H':
            curX = parseFloat(tokens[i++]); path.lineTo(curX, curY); break;
          case 'h':
            curX += parseFloat(tokens[i++]); path.lineTo(curX, curY); break;
          case 'V':
            curY = parseFloat(tokens[i++]); path.lineTo(curX, curY); break;
          case 'v':
            curY += parseFloat(tokens[i++]); path.lineTo(curX, curY); break;
          case 'C':
            const x1 = parseFloat(tokens[i++]), y1 = parseFloat(tokens[i++]);
            const x2 = parseFloat(tokens[i++]), y2 = parseFloat(tokens[i++]);
            curX = parseFloat(tokens[i++]); curY = parseFloat(tokens[i++]);
            path.curveTo(x1, y1, x2, y2, curX, curY); break;
          case 'c':
            const dx1 = curX + parseFloat(tokens[i++]), dy1 = curY + parseFloat(tokens[i++]);
            const dx2 = curX + parseFloat(tokens[i++]), dy2 = curY + parseFloat(tokens[i++]);
            curX += parseFloat(tokens[i++]); curY += parseFloat(tokens[i++]);
            path.curveTo(dx1, dy1, dx2, dy2, curX, curY); break;
          case 'Q':
            const qx1 = parseFloat(tokens[i++]), qy1 = parseFloat(tokens[i++]);
            curX = parseFloat(tokens[i++]); curY = parseFloat(tokens[i++]);
            path.quadTo(qx1, qy1, curX, curY); break;
          case 'q':
            const dqx1 = curX + parseFloat(tokens[i++]), dqy1 = curY + parseFloat(tokens[i++]);
            curX += parseFloat(tokens[i++]); curY += parseFloat(tokens[i++]);
            path.quadTo(dqx1, dqy1, curX, curY); break;
          case 'Z':
          case 'z':
            path.closePath(); curX = startX; curY = startY; break;
          default:
            i++; break;
        }
      }
      return path;
    }

    async function loadAndApplyFont(pathStr) {
      try {
        const response = await fetch(pathStr);
        if (!response.ok) throw new Error(`Файл не знайдено: ${pathStr}`);
        const svgText = await response.text();

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(svgText, 'image/svg+xml');
        const fontElem = xmlDoc.querySelector('font');
        const fontFaceNode = xmlDoc.querySelector('font-face');

        const unitsPerEm = parseInt(fontFaceNode?.getAttribute('units-per-em')) || 800;
        const ascent = parseInt(fontFaceNode?.getAttribute('ascent')) || 800;
        const descent = parseInt(fontFaceNode?.getAttribute('descent')) || 0;
        const defaultAdv = parseInt(fontElem?.getAttribute('horiz-adv-x')) || 900;

        const glyphList = [];
        const notdefPath = new opentype.Path();
        notdefPath.moveTo(100, 100); notdefPath.lineTo(700, 100);
        notdefPath.lineTo(700, 700); notdefPath.lineTo(100, 700);
        notdefPath.closePath();
        glyphList.push(new opentype.Glyph({ name: '.notdef', unicode: 0, advanceWidth: defaultAdv, path: notdefPath }));

        let hasSpace = false;
        const glyphNodes = xmlDoc.querySelectorAll('glyph');
        glyphNodes.forEach((node, index) => {
          const unicodeAttr = node.getAttribute('unicode');
          const glyphName = node.getAttribute('glyph-name') || `glyph_${index}`;
          const d = node.getAttribute('d') || '';
          const adv = parseInt(node.getAttribute('horiz-adv-x')) || defaultAdv;

          if (!unicodeAttr && glyphName !== 'space') return;
          const codePoint = unicodeAttr ? unicodeAttr.codePointAt(0) : (glyphName === 'space' ? 32 : null);
          if (codePoint === 32) hasSpace = true;

          if (codePoint !== null) {
            glyphList.push(new opentype.Glyph({
              name: glyphName,
              unicode: codePoint,
              advanceWidth: adv,
              path: parseSvgPathToOpentype(d)
            }));
          }
        });

        if (!hasSpace) {
          glyphList.push(new opentype.Glyph({ name: 'space', unicode: 32, advanceWidth: Math.round(defaultAdv * 0.5), path: new opentype.Path() }));
        }

        const font = new opentype.Font({
          familyName: 'DynamicFont',
          styleName: 'Regular',
          unitsPerEm: unitsPerEm,
          ascender: ascent,
          descender: descent,
          glyphs: glyphList
        });

        const blob = new Blob([font.toArrayBuffer()], { type: 'font/ttf' });
        const blobUrl = URL.createObjectURL(blob);

        fontCounterID++;
        const uniqueFamilyName = `FontUnit_${fontCounterID}`;
        const fontFace = new FontFace(uniqueFamilyName, `url(${blobUrl})`);
        
        await fontFace.load();
        document.fonts.add(fontFace);

        document.querySelectorAll('.tested-font').forEach(el => {
          el.style.fontFamily = `"${uniqueFamilyName}", monospace`;
        });

        const lastSlash = pathStr.lastIndexOf('/');
        const folderPart = lastSlash !== -1 ? pathStr.substring(0, lastSlash) : 'fonts';
        const filePart = lastSlash !== -1 ? pathStr.substring(lastSlash + 1) : pathStr;

        document.getElementById('currentFontLabel').innerHTML = `
          <span class="block text-sm opacity-80">${folderPart} /</span>
          <span class="text-lg">${filePart}</span>
        `;
        document.getElementById('systemStatus').textContent = `Шрифт завантажено успішно (${glyphNodes.length} гліфів)`;

      } catch (err) {
        console.error("Помилка завантаження шрифту:", pathStr, err);
        document.getElementById('currentFontLabel').textContent = pathStr;
        document.getElementById('systemStatus').textContent = `Файл не знайдено або помилка SVG`;
      }
    }

    function updatePoems() {
      document.getElementById('uaPoemText').textContent = uaPoems[currentUaIndex];
      document.getElementById('uaPoemCounter').textContent = `0${currentUaIndex + 1} / 0${uaPoems.length}`;
      currentUaIndex = (currentUaIndex + 1) % uaPoems.length;

      document.getElementById('enPoemText').textContent = enPoems[currentEnIndex];
      document.getElementById('enPoemCounter').textContent = `0${currentEnIndex + 1} / 0${enPoems.length}`;
      currentEnIndex = (currentEnIndex + 1) % enPoems.length;
    }

    function rotateFonts() {
      if (fontPaths.length === 0) return;
      loadAndApplyFont(fontPaths[currentFontIndex]);
      currentFontIndex = (currentFontIndex + 1) % fontPaths.length;
    }

    window.addEventListener('DOMContentLoaded', () => {
      updatePoems();
      rotateFonts();

      setInterval(rotateFonts, 5000);
      setInterval(updatePoems, 30000);
    });
  </script>
