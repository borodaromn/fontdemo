<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Font Showcase — Учнівські Шрифти</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- opentype.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            console: {
              bg: '#050a05',
              panel: '#0a140a',
              border: '#1b3b1b',
              neon: '#00ff66',
              dim: '#008833'
            }
          },
          fontFamily: {
            mono: ['Courier New', 'Courier', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #050a05;
      color: #00ff66;
    }
    .console-glow {
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.6), 0 0 20px rgba(0, 255, 102, 0.3);
    }
    .console-box-glow {
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.15), inset 0 0 15px rgba(0, 255, 102, 0.05);
    }
    .tested-font {
      font-family: 'ActiveCustomFont', monospace;
      transition: all 0.3s ease;
      white-space: pre-wrap;
      word-break: break-word;
      text-transform: uppercase;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #050a05;
    }
    ::-webkit-scrollbar-thumb {
      background: #1b3b1b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00ff66;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 selection:bg-console-neon selection:text-black">

  <!-- TOP BANNER -->
  <div class="w-full max-w-6xl mx-auto bg-console-panel border border-console-border rounded-xl p-4 mb-3 text-center console-box-glow">
    <h2 class="text-lg md:text-xl font-extrabold text-console-neon tracking-wider console-glow font-mono uppercase">
      Ці шрифти намалювали наші учні на уроках інформатики.
    </h2>
  </div>

  <!-- HEADER / INFO BANNER -->
  <header class="w-full max-w-6xl mx-auto bg-console-panel border border-console-border rounded-xl p-4 mb-3 console-box-glow flex flex-col md:flex-row justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-console-border flex items-center justify-center text-console-neon text-xl font-bold animate-pulse">
        <i class="fa-solid fa-terminal"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-wider text-console-neon uppercase">SCHOOL_FONTS // DEMO</h1>
        <p class="text-xs text-console-dim font-mono">Інтервал шрифту: <span id="speedDisplay" class="text-console-neon font-bold">5с</span></p>
      </div>
    </div>

    <!-- INTERACTIVE CONTROL BUTTONS FOR MOBILE & DESKTOP -->
    <div class="flex flex-wrap items-center justify-center gap-2">
      <button id="btnPrev" class="px-3.5 py-2.5 bg-console-bg hover:bg-console-border border border-console-border text-console-neon text-xs font-mono font-bold rounded-lg transition active:scale-95 flex items-center gap-1.5 shadow">
        <i class="fa-solid fa-arrow-left"></i> Назад
      </button>
      <button id="btnFaster" class="px-3.5 py-2.5 bg-console-bg hover:bg-console-border border border-console-border text-console-neon text-xs font-mono font-bold rounded-lg transition active:scale-95 flex items-center gap-1.5 shadow" title="Стрілка вгору">
        <i class="fa-solid fa-bolt"></i> Швидше
      </button>
      <button id="btnSlower" class="px-3.5 py-2.5 bg-console-bg hover:bg-console-border border border-console-border text-console-neon text-xs font-mono font-bold rounded-lg transition active:scale-95 flex items-center gap-1.5 shadow" title="Стрілка вниз">
        <i class="fa-solid fa-hourglass-half"></i> Повільніше
      </button>
      <button id="btnNext" class="px-3.5 py-2.5 bg-console-bg hover:bg-console-border border border-console-border text-console-neon text-xs font-mono font-bold rounded-lg transition active:scale-95 flex items-center gap-1.5 shadow">
        Далі <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <!-- LARGE FONT & FOLDER DISPLAY -->
    <div class="bg-console-bg border border-console-border px-4 py-2.5 rounded-lg text-center flex flex-col items-center justify-center min-w-[280px]">
      <span class="text-[10px] uppercase text-console-dim tracking-widest font-mono">ПОТОЧНИЙ ШРИФТ (КАТАЛОГ / ФАЙЛ):</span>
      <span id="currentFontLabel" class="tested-font text-lg font-extrabold text-console-neon console-glow tracking-wide mt-0.5">ЗАВАНТАЖЕННЯ...</span>
    </div>
  </header>

  <!-- MAIN CONTENT: POEMS DISPLAY -->
  <main class="w-full max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 mb-3">
    
    <!-- UKRAINIAN POEM PANEL -->
    <section class="bg-console-panel border border-console-border rounded-xl p-5 flex flex-col console-box-glow">
      <div class="flex justify-between items-center border-b border-console-border pb-2.5 mb-3">
        <span class="text-xs font-bold uppercase tracking-wider text-console-dim flex items-center gap-2">
          <i class="fa-solid fa-code text-console-neon"></i> УКРАЇНСЬКИЙ ВІРШ [30с]
        </span>
        <span id="uaPoemCounter" class="text-[10px] font-mono text-console-dim bg-console-bg border border-console-border px-2 py-0.5 rounded">01 / 05</span>
      </div>
      <div class="flex-1 bg-console-bg border border-console-border/60 rounded-lg p-4 flex items-center justify-center">
        <div id="uaPoemText" class="tested-font text-console-neon console-glow text-base md:text-lg leading-relaxed text-center"></div>
      </div>
    </section>

    <!-- ENGLISH POEM PANEL -->
    <section class="bg-console-panel border border-console-border rounded-xl p-5 flex flex-col console-box-glow">
      <div class="flex justify-between items-center border-b border-console-border pb-2.5 mb-3">
        <span class="text-xs font-bold uppercase tracking-wider text-console-dim flex items-center gap-2">
          <i class="fa-solid fa-code text-console-neon"></i> ENGLISH POEM [30s]
        </span>
        <span id="enPoemCounter" class="text-[10px] font-mono text-console-dim bg-console-bg border border-console-border px-2 py-0.5 rounded">01 / 05</span>
      </div>
      <div class="flex-1 bg-console-bg border border-console-border/60 rounded-lg p-4 flex items-center justify-center">
        <div id="enPoemText" class="tested-font text-console-neon console-glow text-base md:text-lg leading-relaxed text-center"></div>
      </div>
    </section>

  </main>

  <!-- FOOTER STATUS -->
  <footer class="w-full max-w-6xl mx-auto text-center text-xs text-console-dim font-mono">
    <span>СТАТУС: <span id="systemStatus" class="text-console-neon">Ініціалізація сканування шрифтів...</span></span>
  </footer>

  <script>
    const uaPoems = [

      "Реве та стогне Дніпр широкий,\nСердитий вітер завива,\nДодолу верби гне високі,\nГорами хвилю піддіва.\n\n[Т. Г. Шевченко]",
      "Contra spem spero! Без надії сподіваюсь!\nБуду жити! Геть думи сумні!\nЯ на гору круту крем'яную\nБуду камінь важкий підіймать...\n\n[Леся Українка]",
      "Земле, моя всеплодюча матір!\nСвітліші сили рухом живиш,\nТи наше серце в грудях тремтиш,\nТи наша пісня і наша гать.\n\n[Іван Франко]",
      "І все на світі треба пережити,\nІ кожен циферблат — це тільки мить.\nПовірить в те, що землю варто жити,\nІ знати те, що серце ще болить.\n\n[Ліна Костенко]"
    ];

      "To see a World in a Grain of Sand\nAnd a Heaven in a Wild Flower,\nHold Infinity in the palm of your hand\nAnd Eternity in an hour.\n\n[William Blake]",
      "Hope is the thing with feathers\nThat perches in the soul,\nAnd sings the tune without the words,\nAnd never stops at all.\n\n[Emily Dickinson]",
      "She walks in beauty, like the night\nOf cloudless climes and starry skies;\nAnd all that’s best of dark and bright\nMeet in her aspect and her eyes.\n\n[Lord Byron]"
